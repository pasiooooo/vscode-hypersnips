name: CI and release

on:
  push:
    branches: [main, codex/performance-refactor]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Diagnose native font measurement
        if: failure() && runner.os == 'Windows'
        run: node scripts/diagnose-fonts.cjs
      - name: Extension host tests (Linux)
        if: runner.os == 'Linux'
        run: xvfb-run -a npm run test:integration
      - name: Extension host tests (Windows)
        if: runner.os == 'Windows'
        run: npm run test:integration

  package:
    needs: check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate release version and prepare notes
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/release-notes.cjs "$GITHUB_REF_NAME"

      - name: Install
        run: npm ci

      - name: Package VSIX
        if: github.ref != 'refs/heads/codex/performance-refactor'
        run: npm run package

      - name: Package performance preview
        if: github.ref == 'refs/heads/codex/performance-refactor'
        run: npm run package:performance

      - name: Upload VSIX
        uses: actions/upload-artifact@v4
        with:
          name: vscode-hypersnips-vsix
          path: dist/**/*.vsix
          if-no-files-found: error

      - name: Upload release notes
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: release-notes
          path: tmp/release-notes.md
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: vscode-hypersnips-vsix
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: release-notes
          path: tmp
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/*.vsix --verify-tag --title "$GITHUB_REF_NAME" --notes-file tmp/release-notes.md
